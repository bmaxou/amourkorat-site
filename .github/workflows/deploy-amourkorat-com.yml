name: Deploiement automatique OVH - amourkorat.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Decompression du nouveau site
        run: |
          for z in nouveau-*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d . ; done
          true

      - name: Deploiement FTP vers OVH (hebergement amourks, dossier amourkorat-git)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster131.hosting.ovh.net
          username: amourks
          password: ${{ secrets.FTP_PASSWORD_AMOURKS }}
          protocol: ftp
          port: 21
          server-dir: /amourkorat-git/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            nouveau-*.zip
