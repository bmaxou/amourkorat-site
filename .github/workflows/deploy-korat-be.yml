name: Deploiement automatique OVH - korat.be

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Deploiement FTP vers OVH (korat.be)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_KORAT }}
          username: ${{ secrets.FTP_USERNAME_KORAT }}
          password: ${{ secrets.FTP_PASSWORD_KORAT }}
          protocol: ftp
          port: 21
          server-dir: /www/
